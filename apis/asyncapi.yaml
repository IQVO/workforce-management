asyncapi: 2.6.0

info:
  title: Workforce Management Events
  version: "1.0.0"
  description: |
    Domain-event catalog for **Workforce Management**, a Supporting bounded
    context in the WES (Warehouse Execution Systems) subdomain. It owns "who
    is on shift, on which process path, at what rate; direct vs indirect
    hours" — the shift-start planning horizon (a human commits a split of
    headcount across paths) plus intra-shift assignment tracking (moving
    associates between paths as backlogs deviate). It stops at the path
    boundary: it never links an associate to a specific task, and it never
    decides a rebalance — it makes the labor picture legible and enforces its
    invariants.

    Three aggregates raise the events documented here:

    - `AssociateShift` (package `internal/domain/associate`) — roster entry:
      who is on, their certifications, their break state, their logged hours.
      Raises `AssociateShiftStarted`, `AssociateCertified`,
      `AssociateBreakStarted`, `AssociateBreakEnded`, `AssociateShiftEnded`.
    - `ShiftPlan` (package `internal/domain/shiftplan`) — the committed split
      of headcount across paths for one site's shift (`siteCode`; `buildingId`
      is its deprecated alias, ADR 0035), made of `PathPlan`
      lines. Raises `ShiftPlanProposed`, `ShiftPlanCommitted` and the
      staffing-gap flag `PathUnderstaffed`.
    - `LaborAssignment` (package `internal/domain/assignment`) — one
      associate on one path for an interval, with exactly one ACTIVE
      assignment per associate at a time. Raises `LaborAssigned` and
      `LaborReassigned`.

    **Envelope (mandatory).** Every Kafka message this service produces or
    consumes is a CloudEvents 1.0 event in *structured content mode*
    (ADR-0026, superseding the envelope half of ADR-0004): the Kafka message
    value is the JSON event format, content type
    `application/cloudevents+json`, and every message carries the Kafka header
    `content-type: application/cloudevents+json; charset=UTF-8` alongside the
    W3C `traceparent`/`tracestate` headers. All of `specversion` (`1.0`),
    `id`, `source` (`/warehouse/workforce-management`), `type`, `subject`,
    `time`, `datacontenttype` (`application/json`) and `dataschema` are
    REQUIRED; the bounded context's own payload sits under `data`. There is
    no flat envelope and no envelope toggle.

    **Type naming convention.** The CloudEvents `type` attribute is
    reverse-DNS dotted and follows the exact shape
    `com.warehouse.<subdomain>.<bounded-context>.<entity>.<EventName>`, all
    lowercase except the final PascalCase event name. For this context the
    subdomain is `wes` and the bounded context is `workforce-management`, so
    for example a committed shift plan is published as
    `com.warehouse.wes.workforce-management.shiftplan.ShiftPlanCommitted`.
    The `entity` segment is the aggregate that raises the event —
    `associate`, `shiftplan` or `assignment`. `PathUnderstaffed` uses
    `shiftplan`, since the gap is measured against a committed `ShiftPlan`'s
    planned heads. A breaking payload change gets a new `.v2` type and a new
    `dataschema` version, never a mutation of the old one.

    **dataschema.** `urn:warehouse:workforce-management:<stream>:<EventName>:v1`
    where `<stream>` is `events` for `warehouse.workforce.events` and
    `analytics` for `warehouse.workforce.analytics`. The same occurrence keeps
    the same `type` on both topics; `dataschema` names the payload shape.

    **Subject.** The aggregate instance id: the associate id for
    `associate`/`assignment` events, the path id for `PathUnderstaffed` and
    `ShiftPlanProposed`, and the ShiftPlan aggregate id
    `<buildingId>/<shiftId>` for `ShiftPlanCommitted` (the same value as the
    integration message's Kafka key). The first segment of that id IS the site
    code (ADR 0035): the subject and the Kafka key are unchanged by the
    siteCode convergence, so no consumer's partitioning or ordering moves.

    **siteCode / buildingId (ADR 0035).** The ShiftPlan key has one canonical
    name, `siteCode` (the facility-layout Site code), and one deprecated alias,
    `buildingId`, with the SAME value. `ShiftPlanProposed` and
    `ShiftPlanCommitted` (v1, both topics where published) therefore carry
    `site_code` next to the unchanged, now deprecated, `building_id`. The
    change is additive: no `.v2`, nothing removed, `site_code` is not
    `required` in the schema because messages produced before the addition lack
    it. Removing `building_id` is a future breaking change with its own ADR.

    **Which events leave the process on which topic.** The integration topic
    `warehouse.workforce.events` carries **only** `ShiftPlanCommitted`, fanned
    out into one message per `PathPlan` line. Every event in this catalog is
    published to the internal analytics topic
    `warehouse.workforce.analytics` (consumed by this service's own analytics
    projector, ADR-0010). Each message below pins its exact `type` and
    `dataschema` and documents the payload actually on the wire.

  contact:
    name: Workforce Management — claudioed
    url: https://github.com/claudioed/workforce-management
    email: claudioed.oliveira@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

tags:
  - name: workforce-management
    description: |
      The Workforce Management bounded context (WES subdomain) — headcount
      planning per shift and intra-shift labor assignment tracking.
  - name: associate
    description: |
      Events raised by the `AssociateShift` aggregate — roster membership,
      certifications and break state for one associate on one shift.
  - name: shiftplan
    description: |
      Events raised by the `ShiftPlan` aggregate — proposed and committed
      headcount splits across process paths, and the understaffing flag
      derived from a committed plan.
  - name: assignment
    description: |
      Events raised by the `LaborAssignment` aggregate — an associate placed
      on a path for an interval, and moves between paths.

servers:
  production:
    url: kafka.warehouse-systems.internal:9092
    protocol: kafka
    description: |
      Shared warehouse-systems Kafka cluster. Workforce Management publishes
      its outbound domain events here; downstream bounded contexts (Work
      Planning) consume from the same cluster.

defaultContentType: application/cloudevents+json

channels:
  warehouse.workforce.events:
    description: |
      The single outbound topic for this bounded context, matching the
      `Topic` constant in `internal/adapters/outbound/kafka/publisher.go`
      (`warehouse.workforce.events`). Messages are CloudEvents 1.0
      structured-mode JSON with the `content-type:
      application/cloudevents+json; charset=UTF-8` Kafka header. Consumers
      must dispatch on the full `type`, ignore unknown `type` values, and
      dedupe on `id`.
    subscribe:
      operationId: consumeWorkforceEvents
      summary: Consume Workforce Management domain events.
      description: |
        Subscribe to the Workforce Management domain-event stream. Every
        message is a CloudEvents 1.0 structured-mode event; route on the full
        `type` context attribute, which follows
        `com.warehouse.wes.workforce-management.<entity>.<EventName>`.

        Only `ShiftPlanCommitted` is published to this topic, fanned out into
        one message per `PathPlan` line of the committed plan, each with its
        own unique `id`. The remaining messages listed here are published to
        the analytics topic only — see each message's description.
      tags:
        - name: workforce-management
      message:
        oneOf:
          - $ref: "#/components/messages/ShiftPlanCommitted"

  warehouse.workforce.analytics:
    description: |
      Internal analytics topic (ADR-0010), matching the `AnalyticsTopic`
      constant in `internal/adapters/outbound/kafka/analytics_publisher.go`.
      Every domain event this context raises is published here as a
      CloudEvents 1.0 structured-mode event with dataschema
      `urn:warehouse:workforce-management:analytics:<EventName>:v1`. Consumed
      by this service's own analytics projector (`workforce-analytics`
      consumer group), which dedupes on `id` and dead-letters anything that
      fails CloudEvents validation to `warehouse.workforce.analytics.dlq`.
    subscribe:
      operationId: consumeWorkforceAnalytics
      summary: Consume Workforce Management analytics events.
      description: |
        Subscribe to the analytics stream. Route on the full `type`; the same
        occurrence carries the same `type` as on the integration topic, and
        `dataschema` distinguishes the analytics payload shape.
      tags:
        - name: workforce-management
      message:
        oneOf:
          - $ref: "#/components/messages/ShiftPlanCommittedAnalytics"
          - $ref: "#/components/messages/ShiftPlanProposed"
          - $ref: "#/components/messages/PathUnderstaffed"
          - $ref: "#/components/messages/AssociateShiftStarted"
          - $ref: "#/components/messages/AssociateCertified"
          - $ref: "#/components/messages/AssociateBreakStarted"
          - $ref: "#/components/messages/AssociateBreakEnded"
          - $ref: "#/components/messages/AssociateShiftEnded"
          - $ref: "#/components/messages/LaborAssigned"
          - $ref: "#/components/messages/LaborReassigned"

components:
  messages:
    ShiftPlanCommitted:
      name: ShiftPlanCommitted
      title: Shift plan committed
      summary: A human committed a headcount split across process paths for a site's shift.
      description: |
        Raised by the `ShiftPlan` aggregate when a human commits the split of
        headcount across process paths for one site's shift. The commit
        is validated in the domain: `plannedHeads(path)` must not exceed
        `installedStations(path)`, and planned hours must fit the shift's max
        hours.

        **Published to `warehouse.workforce.events`.** This is the only
        domain event on the integration topic; wes-work-planning dispatches on
        its exact `type`. The adapter loads the committed
        plan through the `ShiftPlanRepo` and **fans the single domain event
        out into one Kafka message per `PathPlan` line** — a plan committed
        with three path lines produces three messages on
        `warehouse.workforce.events`, each carrying that one line's
        `path_id`, `planned_heads`, `planned_rate` and `planned_hours`
        alongside the plan's `site_code` (canonical) and `building_id`
        (deprecated, same value) and `shift_id`. Consumers must
        therefore expect N messages per commit, not one, and must not assume
        a message carries the whole plan. Every line message has its own
        unique CloudEvents `id` (minted once and persisted with the outbox
        row, so a redelivery repeats it); `subject` is the ShiftPlan aggregate
        id `<buildingId>/<shiftId>`, identical to the Kafka key.
      contentType: application/cloudevents+json
      tags:
        - name: shiftplan
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/ShiftPlanCommittedEvent"
      examples:
        - name: packLineCommitted
          summary: One of three messages fanned out from a plan committed for building BLD1, shift SHIFT1.
          payload:
            specversion: "1.0"
            id: "9f1c2b7e-4c3a-4a1d-9f0b-6c2b8a7d1e33"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.shiftplan.ShiftPlanCommitted"
            subject: "BLD1/SHIFT1"
            time: "2026-08-21T22:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:events:ShiftPlanCommitted:v1"
            data:
              site_code: "BLD1"
              building_id: "BLD1"
              shift_id: "SHIFT1"
              path_id: "pack"
              planned_heads: 3
              planned_rate: 50
              planned_hours: 24

    ShiftPlanCommittedAnalytics:
      name: ShiftPlanCommitted
      title: Shift plan committed (analytics)
      summary: The analytics-topic form of a shift-plan commit — one message per commit, not per line.
      description: |
        Published only to `warehouse.workforce.analytics`. Same `type` as the
        integration message, different `dataschema` and payload: one message
        per commit carrying just the plan's identity. Kafka key is the
        building id; `subject` is the ShiftPlan aggregate id
        `<buildingId>/<shiftId>`.
      contentType: application/cloudevents+json
      tags:
        - name: shiftplan
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/ShiftPlanCommittedAnalyticsEvent"
      examples:
        - name: planCommittedAnalytics
          summary: The analytics record of a plan committed for building BLD1, shift SHIFT1.
          payload:
            specversion: "1.0"
            id: "4f2a9c1d-7b3e-4d8a-9e61-2c5b7a0d3f19"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.shiftplan.ShiftPlanCommitted"
            subject: "BLD1/SHIFT1"
            time: "2026-08-21T22:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:ShiftPlanCommitted:v1"
            data:
              site_code: "BLD1"
              building_id: "BLD1"
              shift_id: "SHIFT1"

    ShiftPlanProposed:
      name: ShiftPlanProposed
      title: Shift plan proposed
      summary: Heads for a path were computed from charge and planned rate, ahead of any human commit.
      description: |
        Raised by the `ShiftPlan` aggregate when heads for a path are
        proposed as a pure computation — `heads = ceil(charge / plannedRate)`
        — before a human commits anything. A proposal is advisory: the
        software proposes, a human commits.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: shiftplan
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/ShiftPlanProposedEvent"
      examples:
        - name: packHeadsProposed
          summary: Six heads proposed for the pack path at a planned rate of 50 units/hour.
          payload:
            specversion: "1.0"
            id: "3d4a1f60-2b8e-4c17-8a55-0c6f9d2b41aa"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.shiftplan.ShiftPlanProposed"
            subject: "BLD1/pack"
            time: "2026-08-21T21:30:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:ShiftPlanProposed:v1"
            data:
              site_code: "BLD1"
              building_id: "BLD1"
              path_id: "pack"
              planned_heads: 6
              planned_rate: 50

    PathUnderstaffed:
      name: PathUnderstaffed
      title: Path understaffed
      summary: A path's active assignments fall short of its committed planned heads.
      description: |
        Raised when the staffing-gap read model finds that a path's active
        `LaborAssignment` count is below the `plannedHeads` committed for it
        on the current `ShiftPlan`. This is a **flag, not a decision**: this
        bounded context surfaces the gap and never moves anyone in response.
        Rebalancing is a human call, recorded back here as a new assignment.

        **Site scope (ADR 0034, additive).** When the gap was requested for
        one canonical site, `data.site_code` carries it and `active_heads`
        counts only associates with an active shift at that site. When
        `site_code` is absent the gap is **unscoped** (every site together,
        the pre-ADR-0034 behaviour): consumers MUST treat absence as
        "unscoped", never as a particular site.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: shiftplan
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/PathUnderstaffedEvent"
      examples:
        - name: packUnderstaffed
          summary: The pack path is planned for 5 heads but only 3 assignments are active.
          payload:
            specversion: "1.0"
            id: "b81e5f2c-7a94-4d0e-9c33-1e7f4b6a8d05"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.shiftplan.PathUnderstaffed"
            subject: "pack"
            time: "2026-08-22T02:15:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:PathUnderstaffed:v1"
            data:
              path_id: "pack"
              planned_heads: 5
              active_heads: 3
        - name: packUnderstaffedAtSite
          summary: The same gap computed for site WH1 only (additive site_code).
          payload:
            specversion: "1.0"
            id: "c92f6a3d-8ba5-4e1f-8d44-2f8a5c7b9e16"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.shiftplan.PathUnderstaffed"
            subject: "pack"
            time: "2026-08-22T02:15:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:PathUnderstaffed:v1"
            data:
              path_id: "pack"
              planned_heads: 5
              active_heads: 2
              site_code: "WH1"

    AssociateShiftStarted:
      name: AssociateShiftStarted
      title: Associate shift started
      summary: An associate's roster entry was created for the shift, with their certifications.
      description: |
        Raised by the `AssociateShift` aggregate when an associate's shift
        roster entry is created. The associate's certifications are the
        qualification gate for assignment: an associate untrained on a path
        cannot be placed on it.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: associate
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/AssociateShiftStartedEvent"
      examples:
        - name: associateOnShift
          summary: Associate A-1001 starts a shift.
          payload:
            specversion: "1.0"
            id: "c4d9a1b2-5e63-4f8a-b0d7-2a9c3e1f7b44"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.associate.AssociateShiftStarted"
            subject: "A-1001"
            time: "2026-08-21T22:05:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:AssociateShiftStarted:v1"
            data:
              associate_id: "A-1001"

    AssociateCertified:
      name: AssociateCertified
      title: Associate certified
      summary: A certification was added to an associate's roster entry.
      description: |
        Raised by the `AssociateShift` aggregate when a named qualification
        (for example `pack`, `pick` or `hazmat`) is added to an associate.
        Certifications gate assignment: `AssignLabor` rejects an associate
        who does not hold the path's required certification.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: associate
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/AssociateCertifiedEvent"
      examples:
        - name: hazmatCertified
          summary: Associate A-1001 gains the hazmat certification mid-shift.
          payload:
            specversion: "1.0"
            id: "7e2f80a3-91c4-4b56-8de1-3f5a2c9b6d18"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.associate.AssociateCertified"
            subject: "A-1001"
            time: "2026-08-22T00:40:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:AssociateCertified:v1"
            data:
              associate_id: "A-1001"
              certification: "hazmat"

    AssociateBreakStarted:
      name: AssociateBreakStarted
      title: Associate break started
      summary: An associate began a logged break and is no longer assignable.
      description: |
        Raised by the `AssociateShift` aggregate when an associate begins a
        logged break. While a break is active the associate cannot be given a
        new `LaborAssignment` — `AssignLabor` rejects the attempt.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: associate
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/AssociateBreakStartedEvent"
      examples:
        - name: breakStarted
          summary: Associate A-1001 goes on break.
          payload:
            specversion: "1.0"
            id: "1a6b4c8d-0e27-43f9-9b51-8c7d2e4a5f36"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.associate.AssociateBreakStarted"
            subject: "A-1001"
            time: "2026-08-22T01:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:AssociateBreakStarted:v1"
            data:
              associate_id: "A-1001"

    AssociateBreakEnded:
      name: AssociateBreakEnded
      title: Associate break ended
      summary: An associate ended a logged break and is assignable again.
      description: |
        Raised by the `AssociateShift` aggregate when an associate's logged
        break ends. The associate becomes eligible for a new
        `LaborAssignment` again, subject to the certification gate.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: associate
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/AssociateBreakEndedEvent"
      examples:
        - name: breakEnded
          summary: Associate A-1001 returns from break.
          payload:
            specversion: "1.0"
            id: "5c0d8e19-6a3b-472c-91ef-4b8a0d6c3e57"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.associate.AssociateBreakEnded"
            subject: "A-1001"
            time: "2026-08-22T01:30:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:AssociateBreakEnded:v1"
            data:
              associate_id: "A-1001"

    AssociateShiftEnded:
      name: AssociateShiftEnded
      title: Associate shift ended
      summary: An associate's shift closed, ending all of their active assignments.
      description: |
        Raised by the `AssociateShift` aggregate when an associate's shift
        closes. Closing a shift ends every active `LaborAssignment` for that
        associate, so downstream consumers should treat this as a terminal
        signal for the associate's labor picture on the shift.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: associate
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/AssociateShiftEndedEvent"
      examples:
        - name: shiftEnded
          summary: Associate A-1001 clocks out at end of shift.
          payload:
            specversion: "1.0"
            id: "e2b7d3f4-8c15-4a6e-b09d-7f3c1a5b2d68"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.associate.AssociateShiftEnded"
            subject: "A-1001"
            time: "2026-08-22T06:00:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:AssociateShiftEnded:v1"
            data:
              associate_id: "A-1001"

    LaborAssigned:
      name: LaborAssigned
      title: Labor assigned
      summary: An associate was placed on a process path for an interval.
      description: |
        Raised by the `LaborAssignment` aggregate when an associate is
        assigned to a process path. The domain enforces two hard invariants
        before this event exists: the associate holds the path's required
        certification, and the associate has no other ACTIVE assignment (no
        double-booking across paths).

        Note the path boundary: this places an associate on a *path*, never
        on a specific task. Dispatching individual tasks belongs to
        Fulfillment Execution.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: assignment
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/LaborAssignedEvent"
      examples:
        - name: assignedToPack
          summary: Associate A-1001 is assigned to the pack path.
          payload:
            specversion: "1.0"
            id: "0b3f6a29-4d71-4e8c-a25b-9e1d7c4f8a02"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.assignment.LaborAssigned"
            subject: "A-1001"
            time: "2026-08-21T22:10:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:LaborAssigned:v1"
            data:
              associate_id: "A-1001"
              path_id: "pack"

    LaborReassigned:
      name: LaborReassigned
      title: Labor reassigned
      summary: An associate's active assignment was ended in favour of another path.
      description: |
        Raised by the `LaborAssignment` aggregate when an associate's prior
        active assignment is closed and a new one opened on a different path
        — the intra-shift move that keeps the one-ACTIVE-assignment invariant
        intact. The move is always a human call recorded here; this context
        never decides a rebalance on its own.

        **Not on the integration topic.** Published only to the internal
        analytics topic `warehouse.workforce.analytics` (dataschema
        `urn:warehouse:workforce-management:analytics:<EventName>:v1`).
      contentType: application/cloudevents+json
      tags:
        - name: assignment
        - name: workforce-management
      payload:
        $ref: "#/components/schemas/LaborReassignedEvent"
      examples:
        - name: movedPackToPick
          summary: Associate A-1001 is moved from pack to pick as the pick backlog grows.
          payload:
            specversion: "1.0"
            id: "a75c1e88-3b02-4f6d-8c94-2d6b5a0f3e71"
            source: "/warehouse/workforce-management"
            type: "com.warehouse.wes.workforce-management.assignment.LaborReassigned"
            subject: "A-1001"
            time: "2026-08-22T02:20:00Z"
            datacontenttype: "application/json"
            dataschema: "urn:warehouse:workforce-management:analytics:LaborReassigned:v1"
            data:
              associate_id: "A-1001"
              from_path_id: "pack"
              to_path_id: "pick"

  schemas:
    CloudEventBase:
      type: object
      title: CloudEvents 1.0 context attributes
      description: |
        The CloudEvents 1.0 structured-mode context attributes shared by
        every message (ADR-0026). Every attribute is REQUIRED. Each event
        schema below composes this base with an `allOf` and pins its own
        `type` const and `dataschema` const.
      required:
        - specversion
        - id
        - source
        - type
        - subject
        - time
        - datacontenttype
        - dataschema
        - data
      properties:
        specversion:
          type: string
          description: CloudEvents specification version. Always "1.0" on this channel.
          enum: ["1.0"]
        id:
          type: string
          format: uuid
          description: |
            Unique identifier of this event occurrence, a UUID v4 minted once
            by the publisher and persisted with the outbox row, so a
            redelivery carries the same id. `(source, id)` is the consumer
            idempotency key.
        source:
          type: string
          format: uri-reference
          description: The producing context. Always "/warehouse/workforce-management".
          enum: ["/warehouse/workforce-management"]
        type:
          type: string
          description: |
            Reverse-DNS event type,
            `com.warehouse.wes.workforce-management.<entity>.<EventName>`.
        subject:
          type: string
          description: |
            Identifier of the aggregate instance this occurrence is about —
            an associate id, a path id, or a `buildingId/shiftId` pair. Never
            empty.
          minLength: 1
        time:
          type: string
          format: date-time
          description: RFC3339 UTC timestamp of when the event occurred in the domain.
        datacontenttype:
          type: string
          description: Content type of the `data` member. Always "application/json".
          enum: ["application/json"]
        dataschema:
          type: string
          format: uri
          description: |
            Absolute URI naming the payload shape,
            `urn:warehouse:workforce-management:<events|analytics>:<EventName>:v<N>`.
        data:
          type: object
          description: The event payload.

    ShiftPlanCommittedEvent:
      title: ShiftPlanCommitted CloudEvent
      description: |
        CloudEvent for one `PathPlan` line of a committed
        `ShiftPlan`. The `data` fields mirror exactly what the Kafka
        publisher emits per line.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed type for this event.
              const: "com.warehouse.wes.workforce-management.shiftplan.ShiftPlanCommitted"
            dataschema:
              type: string
              description: Fixed dataschema for this event.
              const: "urn:warehouse:workforce-management:events:ShiftPlanCommitted:v1"
            data:
              type: object
              description: One committed PathPlan line, in the context of its building and shift.
              required:
                - building_id
                - shift_id
                - path_id
                - planned_heads
                - planned_rate
                - planned_hours
              properties:
                site_code:
                  type: string
                  description: |
                    Canonical name of the shift-plan key (ADR 0035): the Site
                    code the shift plan was committed for. Carries the SAME
                    value as `building_id`. Added after v1 shipped, so it is
                    deliberately not `required` -- messages produced before
                    the addition lack it; consumers must fall back to
                    `building_id` when it is absent. The first segment of
                    `subject` and of the Kafka key is this value.
                building_id:
                  type: string
                  deprecated: true
                  description: |
                    DEPRECATED -- use `site_code`; same value. Kept, not
                    removed (additive change, no `.v2`); removal needs a later
                    breaking ADR. Site the shift plan was committed for.
                shift_id:
                  type: string
                  description: Shift the plan covers. One ShiftPlan exists per site per shift.
                path_id:
                  type: string
                  description: Process path this line plans headcount for, e.g. "pack".
                planned_heads:
                  type: integer
                  minimum: 0
                  description: Heads committed to this path. Never exceeds the path's installed stations.
                planned_rate:
                  type: number
                  description: Planned units per hour per head used to size this line.
                planned_hours:
                  type: number
                  description: Total labor hours committed to this path for the shift.

    ShiftPlanCommittedAnalyticsEvent:
      title: ShiftPlanCommitted analytics CloudEvent
      description: CloudEvent for one shift-plan commit on the analytics topic.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed type for this event (same occurrence type as the integration message).
              const: "com.warehouse.wes.workforce-management.shiftplan.ShiftPlanCommitted"
            dataschema:
              type: string
              description: Fixed dataschema for this event.
              const: "urn:warehouse:workforce-management:analytics:ShiftPlanCommitted:v1"
            data:
              type: object
              description: The committed plan's identity.
              required:
                - building_id
                - shift_id
              properties:
                site_code:
                  type: string
                  description: |
                    Canonical name of the shift-plan key (ADR 0035): the Site
                    code the shift plan was committed for. Carries the SAME
                    value as `building_id`. Added after v1 shipped, so it is
                    deliberately not `required` -- messages produced before
                    the addition lack it; consumers must fall back to
                    `building_id` when it is absent.
                building_id:
                  type: string
                  deprecated: true
                  description: |
                    DEPRECATED -- use `site_code`; same value. Kept, not
                    removed (additive change, no `.v2`); removal needs a later
                    breaking ADR. Site the shift plan was committed for.
                shift_id:
                  type: string
                  description: Shift the plan covers.

    ShiftPlanProposedEvent:
      title: ShiftPlanProposed CloudEvent
      description: CloudEvent for a proposed, not-yet-committed headcount figure for one path.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed type for this event.
              const: "com.warehouse.wes.workforce-management.shiftplan.ShiftPlanProposed"
            dataschema:
              type: string
              description: Fixed dataschema for this event.
              const: "urn:warehouse:workforce-management:analytics:ShiftPlanProposed:v1"
            data:
              type: object
              description: The computed proposal for one path, ahead of a human commit.
              required:
                - building_id
                - path_id
                - planned_heads
                - planned_rate
              properties:
                site_code:
                  type: string
                  description: |
                    Canonical name of the shift-plan key (ADR 0035): the Site
                    code the proposal was computed for. Carries the SAME
                    value as `building_id`. Added after v1 shipped, so it is
                    deliberately not `required`; consumers must fall back to
                    `building_id` when it is absent.
                building_id:
                  type: string
                  deprecated: true
                  description: |
                    DEPRECATED -- use `site_code`; same value. Kept, not
                    removed (additive change, no `.v2`); removal needs a later
                    breaking ADR. Site the proposal was computed for.
                path_id:
                  type: string
                  description: Process path the heads were proposed for.
                planned_heads:
                  type: integer
                  minimum: 0
                  description: Proposed heads, computed as ceil(charge / plannedRate).
                planned_rate:
                  type: number
                  description: Planned units per hour per head used in the computation.

    PathUnderstaffedEvent:
      title: PathUnderstaffed CloudEvent
      description: CloudEvent for the staffing-gap flag on a single path.
      allOf:
        - $ref: "#/components/schemas/CloudEventBase"
        - type: object
          required:
            - type
            - dataschema
            - data
          properties:
            type:
              type: string
              description: Fixed type for this event.
              const: "com.warehouse.wes.workforce-management.shiftplan.PathUnderstaffed"
            dataschema:
              type: string
              description: Fixed dataschema for this event.
              const: "urn:warehouse:workforce-management:analytics:PathUnderstaffed:v1"
            data:
              type: object
              description: Planned versus actually active heads for one path.
              required:
                - path_id
                - planned_heads
                - active_heads
              properties:
                path_id:
                  type: string
                  description: Process path whose active assignments fall short of plan.
                planned_heads:
                  type: integer
                  minimum: 0
                  description: Heads committed to this path on the current ShiftPlan.
                active_heads:
                  type: integer
                  minimum: 0
                  description: Count of currently ACTIVE LaborAssignments on this path.
                site_code:
                  type: string
                  description: >-
                    ADDITIVE and optional (ADR 0034; the payload stays v1). The
                    canonical Site code (the facility-layout Site code, the
                    same identifier warehouse-planning carries as `site_id`)
                    the gap was computed for: `active_heads` then counts only
                    associates with an active shift at that site. Omitted when
                    the gap was computed fleet-wide, so consumers MUST treat
                    absence as "unscoped" (every site together), never as a
                    particular site.
                  example: "WH1"

    AssociateShiftStartedEvent:

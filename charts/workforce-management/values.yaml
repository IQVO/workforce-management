# Default values for workforce-management.

replicaCount: 1

image:
  repository: workforce-management
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: workforce-management.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Gateway API HTTPRoute: an additive, disabled-by-default alternative to the
# Ingress above. warehouse-infra's Kong Ingress Controller routes HTTPRoute
# traffic once its GatewayClass carries the konghq.com/gatewayclass-unmanaged
# annotation (verified live in the fulfillment-execution pilot). Flipping a
# service from Ingress to HTTPRoute is then just enabling this block and
# disabling ingress.enabled above — both can also coexist during migration.
gatewayApi:
  enabled: false
  parentRefs:
    - name: ""
      namespace: ""
      sectionName: "http"
  hosts:
    - path: /
      pathType: PathPrefix
  stripPath: true

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# HorizontalPodAutoscaler (autoscaling/v2) per independently-scalable
# workload type, porting order-management's Phase 3 scalability reference
# (ADR-0026 there; this repo's own HPA + pgxpool-tuning ADR below) — do
# not redesign, mirror it. Every block below defaults `enabled: false` so
# this PR cannot silently change production replica behaviour on merge —
# the fleet turns these on deliberately later, after this PR proves the
# shape is correct. When a component's autoscaling.<x>.enabled=true, that
# Deployment's own replicaCount / analytics.<x>.replicaCount value is
# OMITTED from the rendered manifest (see each deployment template's
# `{{- if not .Values.autoscaling.<x>.enabled }}` guard) so the HPA
# controller is the SOLE owner of .spec.replicas — a hardcoded `replicas:`
# field competing with the HPA would otherwise fight it on every
# reconcile.
#
# mcp deliberately has NO block here (skipped, not just disabled): its
# StreamableHTTPHandler (github.com/modelcontextprotocol/go-sdk/mcp)
# keeps a per-process, in-memory session state keyed by the MCP
# protocol's own Mcp-Session-Id header (see
# internal/adapters/inbound/mcp/server.go and that SDK package's
# streamable.go) — a real session, not just a TCP/HTTP connection.
# charts/workforce-management/templates/mcp-service.yaml is a plain
# ClusterIP Service with no sessionAffinity configured, so a second
# request carrying the same Mcp-Session-Id (a multi-call MCP session,
# e.g. initialize then a later tools/call) could be routed by kube-proxy
# to a DIFFERENT pod than the one that created the session, which has
# never heard of that session id and would reject it. This is genuine
# in-memory-only per-replica state, not the OLTP api Deployment's
# read-only/rebuild-from-Kafka kind — mcp is NOT safely horizontally
# scalable as currently built. Making it so would require either
# sessionAffinity: ClientIP (a partial mitigation, not a fix — it breaks
# the moment a client's IP changes, e.g. behind an LB) or a
# shared/external EventStore (mcp.StreamableHTTPOptions.EventStore) for
# session state, which is a real code change out of scope for this
# chart-and-pgxpool-tuning PR. mcp.replicaCount therefore stays a plain,
# un-autoscaled value (see mcp: below); revisit if/when the SDK wiring
# adopts Stateless mode or an external session store.
autoscaling:
  # cmd/workforce (this Deployment): stateless OLTP HTTP service. Its two
  # per-process caches (kafkacatalog's process-path catalogue consumer,
  # laborperformancecache's measured-rate/idle-share cache; both under
  # PATH_CATALOGUE_SOURCE=kafka / LABOR_PERFORMANCE_MODE=kafka-cache) use
  # a PER-PROCESS-UNIQUE consumer group id (uniqueConsumerGroup(), keyed
  # by hostname+PID+timestamp) — safe to run N independent copies of by
  # design, each replaying its own full copy from FirstOffset. This
  # service has no inbound OLTP-mutating Kafka consumer analogous to
  # order-management's RepromiseConsumer, so there is no shared-group
  # concern to verify on the api Deployment at all. max 4 / target 70%
  # CPU, matching the reference PR's numbers.
  api:
    enabled: false
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
  # cmd/workforce-projector: see analytics.projector's own comment below
  # for why max is capped at 2, not 4 -- it is a Kafka consumer under a
  # stable shared group, not a plain stateless HTTP server.
  projector:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70
  # cmd/workforce-reports: stateless read-only REST reader, same
  # treatment as api.
  reports:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  # frontend (web/, nginx-unprivileged serving the built SPA bundle):
  # pure static-asset serving, no server-side session or per-request
  # state whatsoever -- the most trivially horizontally scalable
  # workload in this chart.
  frontend:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

config:
  httpAddr: ":8080"
  eventPublisher: "log"   # "log" or "kafka"
  migrationsPath: "migrations"
  maxHoursPerShift: "8.0"

# UNLIKE THE OTHER THREE SERVICES: this binary calls requireEnv("DATABASE_URL")
# and log.Fatalf's (crash-loops) if it's unset — there is no in-memory
# fallback. You MUST set database.url or database.existingSecret; the chart
# refuses to render (a clear `helm install`-time error) rather than let you
# ship a crash-looping pod, matching the binary's own fail-fast design.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: "DATABASE_URL"

kafka:
  enabled: false
  brokers: "kafka:9092"

# OpenTelemetry. Traces and metrics are PUSHED over OTLP/gRPC to a Collector;
# there is no scrape endpoint on the pod. Export is non-blocking, so pointing
# this at an unreachable Collector degrades to "telemetry dropped", never to a
# crash-looping or hanging pod.
otel:
  enabled: true
  endpoint: "otel-collector.observability.svc.cluster.local:4317"
  serviceName: "workforce-management"

# deployment.environment.name resource attribute on every span and metric.
environment: "local"

# Log level for the JSON slog handler: debug|info|warn|error.
logLevel: "info"

extraEnv: []

# ---------------------------------------------------------------------------
# Process-path catalogue (ADR-0013 here / ADR-0017 in fulfillment-execution):
# a boot-time-required file this binary reads via PATH_CATALOGUE_FILE.
# warehouse-infra owns the canonical content (config/process-paths/*.yaml is
# the fleet's published-language source of truth, shared verbatim with
# fulfillment-execution and wes-work-planning) -- this chart just knows how
# to mount whatever content it's given.
# ---------------------------------------------------------------------------
pathCatalogue:
  enabled: true
  mountPath: "/etc/workforce-management"
  # Raw YAML content of the catalogue file (e.g. via --set-file or a
  # values.yaml `content: |` block). Ignored when existingConfigMap is set.
  content: ""
  # Name of a pre-existing ConfigMap with a "process-paths.yaml" data key.
  # When set, content above is ignored and no ConfigMap is created here.
  existingConfigMap: ""

# Gates liveness and readiness until the process is actually serving.
#
# Without it, BOOT WORK RACES THE LIVENESS PROBE and loses: this binary
# runs migrations before it starts listening, and in this cluster every
# injected pod's first outbound dial is reset ~10s after start (Istio
# native sidecars), so the first migration attempt fails and the retry
# (see internal/adapters/outbound/bootretry) pushes first-listen past the
# liveness threshold. Observed live as CrashLoopBackOff with exit code
# 143 — SIGTERM, the kubelet killing a pod that was still booting, which
# reads like an app crash and is not one.
#
# 30 x 2s = 60s of grace, comfortably past the ~31s retry budget in
# bootretry, after which liveness takes over unchanged. A genuinely
# broken database still fails the pod; it just is not mistaken for a
# slow one. Applies to every deployment in this chart (api, projector,
# reports, mcp).
startupProbe:
  httpGet:
    path: /healthz
    port: http
  periodSeconds: 2
  failureThreshold: 30

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  httpGet:
    # /readyz (ADR-0022 §graceful shutdown, ported from
    # order-management's ADR-0025), NOT /healthz: readiness must flip
    # to not-ready during a graceful SIGTERM drain (see
    # cmd/workforce/main.go's shutdown sequence) so this pod stops
    # receiving NEW traffic while it finishes in-flight requests --
    # /healthz stays a pure liveness signal ("is the process alive")
    # and is deliberately never flipped by shutdown, or Kubernetes
    # would kill the pod mid-drain instead of letting it finish.
    path: /readyz
    port: http
  initialDelaySeconds: 3
  periodSeconds: 5

# Gives cmd/workforce/main.go's graceful shutdown sequence (readiness
# flip -> HTTP drain -> catalogue/rate-cache Kafka consumer clean stop
# -> outbox relay stop -> pg pool close last) room to actually finish
# before Kubernetes SIGKILLs the container. 10s (the HTTP Shutdown
# budget) + margin for the readinessProbe's periodSeconds=5 to have
# observed the not-ready flip before traffic fully stops arriving.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

# --- analytics data product (ADR-0010) ---
# The per-service "Labor Utilization & Staffing" report: a separate
# analytics topic, a writer (projector) and a read-only reader (reports),
# backed by a separate analytical database. Disabled by default so existing
# releases are unaffected; set analytics.enabled=true to deploy the two extra
# processes.
analytics:
  enabled: false
  # Directory (inside the image) of the analytical *.up.sql migrations the
  # projector applies on start.
  migrationsPath: "migrations/analytics"
  database:
    # The projector's read-write analytical DSN.
    projectorUrl: ""
    # The reader's DSN — a read-only role where possible; falls back to the
    # projector DSN when empty (local/dev).
    reportsUrl: ""
    # Name of an existing Secret with ANALYTICS_DATABASE_URL and
    # ANALYTICS_READER_DATABASE_URL keys. Takes precedence over the URLs above.
    existingSecret: ""
  projector:
    replicaCount: 1
    adminAddr: ":8091"
    # HPA min 1 / max 2, NOT 4: kafka.AnalyticsConsumerGroup
    # ("workforce-analytics") is a STABLE, shared consumer-group name
    # with no per-instance uniqueness (internal/adapters/inbound/kafka/
    # analytics_consumer.go) -- the fleet's correctly-scalable
    # convention (same shape as order-management's projector) -- so N
    # replicas legitimately share the analytics topic's partitions via
    # normal Kafka rebalancing, not a collision risk. Capped at 2, not
    # left at api's 4, because the analytics topic is keyed by
    # aggregate id (AssociateId/PathId, AnalyticsPublisher.Encode), so
    # ordering is only guaranteed per-aggregate/per-partition, and
    # every write is already idempotent on event_id
    # (ConsumedEventsRepo.MarkProcessed) -- correctness does not
    # regress at 2, but there is no throughput case yet that justifies
    # more. See the top-level autoscaling.projector block.
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi
  reports:
    replicaCount: 1
    httpAddr: ":8092"
    service:
      type: ClusterIP
      port: 80
      targetPort: 8092
    # Stateless read-only REST reader over the analytical database (its
    # own read-only pgxpool, analyticsstore.NewReadOnlyPool) -- no
    # in-memory state, safe to run N independent copies of. max 3 /
    # target 70% CPU, same treatment as the OLTP api Deployment. See
    # the top-level autoscaling.reports block.
    resources:
      limits:
        cpu: 500m
        memory: 256Mi
      requests:
        cpu: 100m
        memory: 128Mi

# --- MCP server (ADR-0008) ---
# A second deployable (/app/mcp in the same image) exposing this context's
# use cases to AI clients over MCP Streamable HTTP. It runs the same use
# cases over the same OLTP database (DATABASE_URL from the database secret).
# Disabled by default so existing releases are unaffected; set
# mcp.enabled=true to deploy it.
#
# Deliberately NOT HPA-scalable (no autoscaling.mcp block exists in this
# chart) — see the top-level autoscaling: block's comment for the full
# reasoning: the SDK's StreamableHTTPHandler keeps in-memory, per-process
# MCP session state keyed by Mcp-Session-Id, and this chart's
# mcp-service.yaml has no session affinity, so a second replica could
# receive a mid-session request its own process never created.
# replicaCount therefore stays a plain, manually-set value.
mcp:
  enabled: false
  replicaCount: 1
  # MCP_ADDR the binary listens on; keep in sync with service.targetPort.
  httpAddr: ":8090"
  service:
    type: ClusterIP
    port: 8090
    targetPort: 8090
  # Base URL of the reports REST service the curated
  # get_workforce_labor_report tool calls (REPORTS_BASE_URL). When empty and
  # analytics.enabled is true, defaults to the in-cluster reports Service.
  # The tool is not registered when the resulting URL is empty.
  reportsBaseUrl: ""
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

# --- frontend (REMOTE Module Federation remote) ---
# The operator SPA remote, built from web/ and served by its own
# nginx-unprivileged pod. In the kind cluster it is reached through
# warehouse-infra's Nginx web gateway at http://localhost/mfes/workforce-management/
# -- never through Kong, which serves APIs only and must never handle HTML,
# JavaScript, CSS, fonts or images.
#
# Deliberately NO ingress/httproute/gatewayApi block here: frontend path
# routing is owned entirely by the Nginx web gateway, and the Service stays
# ClusterIP so this is not a second host-facing entrypoint.
#
# Disabled by default so existing releases are unaffected; warehouse-infra
# sets frontend.enabled=true and supplies the locally built image tag.
#
# HPA-eligible: pure static-asset serving via nginx-unprivileged, no
# server-side session or per-request state. See the top-level
# autoscaling.frontend block (max 3 / target 70% CPU).
frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: warehouse/workforce-management-frontend
    pullPolicy: IfNotPresent
    tag: ""
  service:
    port: 80
    targetPort: 8080
  # nginx-unprivileged runs as uid/gid 101.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    fsGroup: 101
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi

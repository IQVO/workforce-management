{{- if .Values.a2a.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "workforce-management.a2aFullname" . }}
  labels:
    {{- include "workforce-management.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "workforce-management.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "workforce-management.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "workforce-management.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            # The A2A agent runs the SAME use cases over the SAME OLTP database
            # as cmd/workforce, so it reads the same DATABASE_URL secret.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "workforce-management.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # See values.yaml's database.migrationsExistingSecretKey comment
            # and ADR-0025 (ported from order-management's ADR-0029):
            # cmd/a2a also runs migrations on start (see the comment
            # above), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "workforce-management.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            - name: MIGRATIONS_PATH
              value: {{ .Values.config.migrationsPath | quote }}
            - name: MAX_HOURS_PER_SHIFT
              value: {{ .Values.config.maxHoursPerShift | quote }}
            # assign_labor publishes LaborAssigned/LaborReassigned through the
            # SAME composition as cmd/workforce (ADR-0039): the events are
            # INSERTed into outbox_events in the use case's transaction; only
            # the api Deployment runs the relay that drains them to Kafka.
            # cmd/a2a refuses to boot without EVENT_PUBLISHER=kafka (or unset)
            # and KAFKA_BROKERS (ADR-0038).
            - name: EVENT_PUBLISHER
              value: {{ .Values.config.eventPublisher | quote }}
            - name: KAFKA_BROKERS
              value: {{ .Values.kafka.brokers | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            # The Agent Card must advertise a URL agent clients can dial
            # (ADR-0039): default to this release's in-cluster Service DNS.
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%d/" (include "workforce-management.a2aFullname" .) .Release.Namespace (int .Values.a2a.service.port)) | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: "workforce-management-a2a"
            - name: SERVICE_VERSION
              value: {{ .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
            {{- end }}
            {{- range .Values.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

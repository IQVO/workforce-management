# Local dependencies for cmd/workforce, cmd/mcp and cmd/workforce-projector:
# Postgres AND Kafka are the only runtime (ADR-0038), there is no in-memory
# mode. `docker compose up -d --wait` then, for example:
#
#   export DATABASE_URL='postgres://workforce:workforce@localhost:5432/workforce?sslmode=disable'
#   export KAFKA_BROKERS='localhost:9092'
#   go run ./cmd/workforce
#
# The broker (confluent-local, KRaft, single node) advertises localhost:9092
# to the host and auto-creates topics on first write, like the cluster does.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: workforce
      POSTGRES_PASSWORD: workforce
      POSTGRES_DB: workforce
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workforce -d workforce"]
      interval: 2s
      timeout: 3s
      retries: 20
  kafka:
    image: confluentinc/confluent-local:7.6.1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s
